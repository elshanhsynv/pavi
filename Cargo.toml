[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/parquet",
    "crates/runtime",
    "crates/query",
    "crates/app",
    "crates/bench",
    "crates/cli",
]

[workspace.package]
# One version for the whole app; release tags are v<version> (docs/RELEASING.md).
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arrow-array = { version = "60", features = ["chrono-tz"] }
arrow-cast = "60"
arrow-schema = "60"
arrow-select = "60"
arrow-ord = "60"
parquet = { version = "60", features = ["arrow"] }
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared lint policy. Every crate opts in with `[lints] workspace = true`.
# clippy.toml allows unwrap/expect/panic inside tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Shipped builds (release.yml) and benchmarks both use this profile.
[profile.release]
lto = "thin"
codegen-units = 1
