[workspace]
resolver = "2"
members = [
    "crates/parquet",
    "crates/runtime",
    "crates/query",
    "crates/app",
    "crates/bench",
    "crates/cli",
]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arrow-array = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-ord = "59"
parquet = { version = "59", features = ["arrow"] }
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
