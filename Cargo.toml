[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/parquet",
    "crates/runtime",
    "crates/query",
    "crates/app",
    "crates/bench",
    "crates/cli",
]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arrow-array = { version = "59", features = ["chrono-tz"] }
arrow-cast = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-ord = "59"
parquet = { version = "59", features = ["arrow"] }
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared lint policy. Every crate opts in with `[lints] workspace = true`.
# clippy.toml allows unwrap/expect/panic inside tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
