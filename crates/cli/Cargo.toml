[package]
name = "cli"
version.workspace = true
edition = "2024"
publish = false

# The package stays `cli` (`cargo run -p cli`); the program is `pavi-cli`, so
# it is recognisable next to `pavi` on PATH and in the release zip.
[[bin]]
name = "pavi-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Colour that turns itself off when stderr isn't a terminal, for the error
# message; both are already in the tree through clap.
anstream = "1"
anstyle = "1"
arrow-array.workspace = true
# Schema and statistics rows, and joining a sorted table's batches; both
# already in the tree through parquet_reader.
arrow-schema.workspace = true
arrow-select.workspace = true
# `wrap_help` wraps --help to the terminal's width (adds `terminal_size`).
clap = { workspace = true, features = ["wrap_help"] }
# `--completions` and `--man`: shell completion scripts and a roff manual page,
# generated from the same argument definitions as --help (clap's own crates;
# clap_mangen adds `roff`).
clap_complete = "4"
clap_mangen = "0.3"
parquet_reader = { path = "../parquet" }
# `--sql` runs on the app's query engine and worker pool (ADR 0011).
pavi_query = { path = "../query" }
pavi_runtime = { path = "../runtime" }
# Terminal column widths for the preview table (CJK and most emoji take two
# columns). Already in the tree through egui's dependencies.
unicode-width = "0.1"
# Grapheme clusters, so an emoji with a skin tone or a flag is measured and
# cut as one character. Already in the tree through egui's dependencies.
unicode-segmentation = "1"

[dev-dependencies]
parquet.workspace = true
tempfile = "3"

[lints]
workspace = true
