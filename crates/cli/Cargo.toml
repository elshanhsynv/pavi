[package]
name = "cli"
version.workspace = true
edition = "2024"
publish = false

# The package stays `cli` (`cargo run -p cli`); the program is `pavi-cli`, so
# it is recognisable next to `pavi` on PATH and in the release zip.
[[bin]]
name = "pavi-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arrow-array.workspace = true
# Schema and statistics rows, and joining a sorted table's batches; both
# already in the tree through parquet_reader.
arrow-schema.workspace = true
arrow-select.workspace = true
clap.workspace = true
parquet_reader = { path = "../parquet" }
# `--sql` runs on the app's query engine and worker pool (ADR 0011).
pavi_query = { path = "../query" }
pavi_runtime = { path = "../runtime" }
# Terminal column widths for the preview table (CJK and most emoji take two
# columns). Already in the tree through egui's dependencies.
unicode-width = "0.1"

[dev-dependencies]
parquet.workspace = true
tempfile = "3"

[lints]
workspace = true
