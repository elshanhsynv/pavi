[package]
name = "parquet_reader"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-csv.workspace = true
arrow-ipc.workspace = true
arrow-json.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
arrow-ord.workspace = true
arrow-row.workspace = true
parquet.workspace = true
ring.workspace = true
# JSON Lines export (moved from the app, which already used it).
serde_json.workspace = true
rustls-native-certs.workspace = true
ureq.workspace = true
# Reading Excel and OpenDocument workbooks (ADR 0021).
calamine = { version = "0.38", default-features = false }
# Writing .xlsx exports, a sheet at a time through temporary files (ADR 0021).
rust_xlsxwriter = { version = "0.104", features = ["constant_memory"] }
# Already in the tree via calamine: reads a workbook's list of parts to check
# their sizes before calamine loads them (ADR 0021).
zip = { version = "9", default-features = false }

[dev-dependencies]
tempfile = "3"
# Already in the tree via parquet; used to forge a corrupt ARROW:schema hint in a test.
base64 = "0.23"

[lints]
workspace = true
