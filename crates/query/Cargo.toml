[package]
name = "pavi_query"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
# Arithmetic, boolean logic and date parts for SQL calculations (ADR 0013):
# the Arrow project's own kernels, the same version as the other arrow crates.
arrow-arith.workspace = true
arrow-array.workspace = true
arrow-cast.workspace = true
# Already in the tree through parquet_reader: sorting and filtering an
# aggregate's result (ORDER BY, HAVING).
arrow-ord.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
# Already in the tree through arrow-array: calendar arithmetic for DATE_TRUNC,
# DATE_DIFF and INTERVAL (ADR 0023). No default features: the time comes
# from the standard library.
chrono = { version = "0.4", default-features = false }
parquet_reader = { path = "../parquet" }
pavi_runtime = { path = "../runtime" }
sqlparser.workspace = true

[dev-dependencies]
parquet.workspace = true
tempfile = "3"

[lints]
workspace = true
